name: Auranion container

on:
  push:
    branches: [auranion]
  pull_request:
    branches: [auranion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auranion-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: khasvn/9router

jobs:
  verify:
    name: Verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/commandcode-claude-regression.test.mjs tests/commandcode-upstream-regression.test.mjs
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate once
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: 9router:test
          labels: |
            org.opencontainers.image.source=https://github.com/KhasVN/9router
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Test actual gateway image with isolated upstream
        run: node tests/docker-smoke.mjs 9router:test
      - name: Log in to Docker Hub
        if: github.repository == 'KhasVN/9router' && github.ref == 'refs/heads/auranion' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested platform image
        if: github.repository == 'KhasVN/9router' && github.ref == 'refs/heads/auranion' && github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag 9router:test "$tag"
          docker push "$tag"

  publish:
    name: Publish tested manifest
    needs: verify
    if: github.repository == 'KhasVN/9router' && github.ref == 'refs/heads/auranion' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish only after both architectures pass
        run: |
          prefix="$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:auranion" \
            --tag "$IMAGE:latest" \
            "$prefix-amd64" "$prefix-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
